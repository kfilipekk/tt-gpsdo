# Tiny Tapeout project information
project:
  title:        "GPS disciplined oscillator with a delay line TDC"
  author:       "Krystian Filipek"
  discord:      ""
  description:  "Locks a 10 MHz oscillator to GPS, timing each pulse to a self-calibrating on-chip delay line"
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"

  top_module:  "tt_um_kfilipekk_gpsdo"

  source_files:
    - "project.v"
    - "tdc.v"
    - "ring.v"
    - "loop.v"
    - "tmr_reg.v"
    - "uart_tx.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "PPS"
  ui[1]: "HOLD"
  ui[2]: "CAL"
  ui[3]: "RING_ON"
  ui[4]: "GAIN0"
  ui[5]: "GAIN1"
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "UART_TX"
  uo[1]: "EFC"
  uo[2]: "PPS_OUT"
  uo[3]: "LOCKED"
  uo[4]: "HOLDOVER"
  uo[5]: "RING_MON"
  uo[6]: "PPS_SEEN"
  uo[7]: "LINE_IN"

  # Bidirectional pins
  uio[0]: "DAC8"
  uio[1]: "DAC9"
  uio[2]: "DAC10"
  uio[3]: "DAC11"
  uio[4]: "DAC12"
  uio[5]: "DAC13"
  uio[6]: "DAC14"
  uio[7]: "DAC15"

# Do not change!
yaml_version: 6
