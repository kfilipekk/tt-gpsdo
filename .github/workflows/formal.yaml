name: formal
on: [push, workflow_dispatch]
jobs:
  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          version: '2026-07-19'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run proofs
        working-directory: formal
        run: |
          sby -f tdc.sby
          sby -f loop.sby
          sby -f top.sby
